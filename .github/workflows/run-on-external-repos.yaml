name: Run on External Repositories

on:
  workflow_dispatch:
    inputs:
      target_repositories:
        description: "Comma-separated list of repositories in owner/repo format (e.g. kubernetes/kubectl,grafana/grafana)"
        required: true
        type: string
      base_ref:
        description: "Branch or ref to checkout (overrides per-repo default branch)"
        required: false
        default: ""
        type: string
      agent_command:
        description: "Agent command to run"
        required: false
        default: ai-factory-agent openai-compatible
        type: string
      validation_command:
        description: "Validation command to run after the agent"
        required: false
        default: go test ./...
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # ── Job 1: Scan for matching issues across repos ─────────────────
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
    steps:
    - name: Validate PAT token
      run: |
        if [[ -z "${GH_TOKEN}" ]]; then
          echo "::error::PAT_TOKEN secret is not configured."
          exit 1
        fi

    - name: Discover matching issues
      id: discover
      run: |
        IFS=',' read -ra REPOS <<< "${{ inputs.target_repositories }}"
        ALL_ISSUES="[]"

        for REPO in "${REPOS[@]}"; do
          REPO=$(echo "$REPO" | xargs)  # trim whitespace
          [[ -z "$REPO" ]] && continue

          echo "Scanning ${REPO}..."

          # Get default branch if base_ref not specified
          REF="${{ inputs.base_ref }}"
          if [[ -z "$REF" ]]; then
            REF=$(gh api "repos/${REPO}" --jq '.default_branch' 2>/dev/null || echo "main")
          fi

          # Query open issues with matching labels
          ISSUES=$(gh api "repos/${REPO}/issues" \
            --method GET \
            -f state=open \
            -f per_page=100 \
            --jq "[.[] | select(
              (.labels | map(.name) | any(. == \"ai-factory\")) and
              (.labels | map(.name) | any(. == \"ai-factory-run\") or any(. == \"ai-factory-smoke\"))
            ) | {repo: \"${REPO}\", issue_number: .number, base_ref: \"${REF}\"}]" 2>/dev/null || echo "[]")

          ISSUE_COUNT=$(echo "$ISSUES" | jq 'length')
          echo "  Found ${ISSUE_COUNT} matching issues in ${REPO}"

          # Dedup: check existing PRs from our fork
          if [[ "$ISSUE_COUNT" -gt 0 ]]; then
            FILTERED="[]"
            REPO_NAME="${REPO#*/}"  # extract repo name without owner
            FORK_OWNER="Verdure-oss"
            while IFS= read -r issue; do
              ISSUE_NUM=$(echo "$issue" | jq '.issue_number')
              BRANCH_NAME="ai-factory-${ISSUE_NUM}"

              # Check if PR already exists from our fork
              EXISTING=$(gh api "repos/${REPO}/pulls" \
                --method GET \
                -f state=all \
                -f per_page=100 \
                --jq "[.[] | select(.head.ref == \"${BRANCH_NAME}\" and .head.repo.owner.login == \"${FORK_OWNER}\")] | length" 2>/dev/null || echo "0")

              if [[ "$EXISTING" -gt 0 ]]; then
                echo "  Skipping #${ISSUE_NUM}: PR already exists"
              else
                FILTERED=$(echo "$FILTERED" | jq --argjson issue "$issue" '. + [$issue]')
              fi
            done < <(echo "$ISSUES" | jq -c '.[]')

            ISSUES="$FILTERED"
            ISSUE_COUNT=$(echo "$ISSUES" | jq 'length')
            echo "  After dedup: ${ISSUE_COUNT} issues to process"
          fi

          ALL_ISSUES=$(echo "$ALL_ISSUES" "$ISSUES" | jq -s '.[0] + .[1]')
        done

        TOTAL=$(echo "$ALL_ISSUES" | jq 'length')
        echo "Total issues to process: ${TOTAL}"
        echo "${ALL_ISSUES}" | jq '.'

        # Use compact JSON for GITHUB_OUTPUT (no newlines)
        echo "matrix=$(echo "$ALL_ISSUES" | jq -c '.')" >> "$GITHUB_OUTPUT"
        echo "count=${TOTAL}" >> "$GITHUB_OUTPUT"

  # ── Job 2: Fork, process, and create PR for each issue ───────────
  run:
    needs: scan
    if: needs.scan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: run-on-external-${{ matrix.repo }}-${{ matrix.issue_number }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJson(needs.scan.outputs.matrix) }}
    env:
      TARGET_REPO: ${{ matrix.repo }}
      ISSUE_NUMBER: ${{ matrix.issue_number }}
      BASE_REF: ${{ matrix.base_ref }}
      AGENT_COMMAND: ${{ inputs.agent_command }}
      VALIDATION_COMMAND: ${{ inputs.validation_command }}
      REPO_NAME: ${{ matrix.repo }}  # will be overridden in steps
      FORK_OWNER: Verdure-oss
      KIND_CLUSTER_NAME: ai-factory-issue
      AGENT_SANDBOX_SRC: /tmp/agent-sandbox
      CODING_AGENT_IMAGE: ai-factory/coding-agent-sandbox:ci
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}

    steps:
    - name: Resolve fork repository name
      run: |
        # Extract repo name without owner (e.g. hermes-agent from jwz722733-blip/hermes-agent)
        REPO_NAME="${TARGET_REPO#*/}"
        echo "REPO_NAME=${REPO_NAME}" >> "$GITHUB_ENV"
        echo "FORK_REPO=${FORK_OWNER}/${REPO_NAME}" >> "$GITHUB_ENV"
        echo "BRANCH_NAME=ai-factory-${ISSUE_NUMBER}" >> "$GITHUB_ENV"
        echo "Target: ${TARGET_REPO}"
        echo "Fork: ${FORK_OWNER}/${REPO_NAME}"
        echo "Branch: ai-factory-${ISSUE_NUMBER}"

    - name: Fetch and validate target issue
      id: fetch-issue
      run: |
        echo "Fetching issue #${ISSUE_NUMBER} from ${TARGET_REPO}..."

        if ! ISSUE_JSON=$(gh api "repos/${TARGET_REPO}/issues/${ISSUE_NUMBER}" 2>&1); then
          echo "::error::Failed to fetch issue: ${ISSUE_JSON}"
          exit 1
        fi

        TITLE=$(echo "$ISSUE_JSON" | jq -r '.title')
        STATE=$(echo "$ISSUE_JSON" | jq -r '.state')
        LABELS=$(echo "$ISSUE_JSON" | jq -r '[.labels[].name] | join(",")')

        echo "Title: ${TITLE}"
        echo "State: ${STATE}"
        echo "Labels: ${LABELS}"
        echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
        echo "issue_json<<EOF" >> "$GITHUB_OUTPUT"
        echo "$ISSUE_JSON" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

        if echo "$LABELS" | grep -q "ai-factory-smoke"; then
          echo "trigger_label=ai-factory-smoke" >> "$GITHUB_OUTPUT"
        else
          echo "trigger_label=ai-factory-run" >> "$GITHUB_OUTPUT"
        fi

    - name: Fork target repository
      run: |
        # Check if fork already exists
        if gh api "repos/${FORK_REPO}" >/dev/null 2>&1; then
          echo "Fork ${FORK_REPO} already exists."
          # Sync fork with upstream if behind
          echo "Syncing fork with upstream..."
          gh api "repos/${FORK_REPO}/merge-upstream" --method POST -f branch="${BASE_REF}" 2>/dev/null || echo "Fork is up to date or sync not needed."
        else
          echo "Creating fork for ${TARGET_REPO}..."
          gh repo fork "${TARGET_REPO}" --default-branch-only
          # Wait for fork to be ready
          for _ in $(seq 1 30); do
            if gh api "repos/${FORK_REPO}" >/dev/null 2>&1; then
              echo "Fork created successfully."
              break
            fi
            sleep 2
          done
        fi

    - name: Checkout fork
      uses: actions/checkout@v4
      with:
        repository: ${{ env.FORK_REPO }}
        ref: ${{ env.BASE_REF }}
        path: fork
        token: ${{ secrets.PAT_TOKEN }}

    - name: Create feature branch in fork
      working-directory: fork
      run: |
        git checkout -b "${BRANCH_NAME}"
        echo "Created branch: ${BRANCH_NAME}"

    - name: Checkout ai-factory
      uses: actions/checkout@v4
      with:
        repository: Verdure-oss/ai-factory
        ref: main
        path: factory

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: factory/go.mod
        cache-dependency-path: factory/go.sum
        cache: true

    - name: Go runtime preflight
      run: bash factory/go-runtime-preflight.sh
      shell: bash

    - name: OpenAI-compatible agent configuration preflight
      if: contains(env.AGENT_COMMAND, 'openai-compatible') && steps.fetch-issue.outputs.trigger_label == 'ai-factory-run'
      env:
        OPENAI_API_KEY: ${{ secrets.AI_FACTORY_OPENAI_API_KEY }}
        OPENAI_BASE_URL: ${{ vars.AI_FACTORY_OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
        OPENAI_MODEL: ${{ vars.AI_FACTORY_OPENAI_MODEL || 'gpt-4.1' }}
        OPENAI_TEMPERATURE: ${{ vars.AI_FACTORY_OPENAI_TEMPERATURE || '1' }}
        OPENAI_MAX_TOKENS: ${{ vars.AI_FACTORY_OPENAI_MAX_TOKENS || '48000' }}
        OPENAI_MAX_TOOL_ROUNDS: ${{ vars.AI_FACTORY_OPENAI_MAX_TOOL_ROUNDS || '40' }}
        OPENAI_MAX_FINAL_SCRIPT_ROUNDS: ${{ vars.AI_FACTORY_OPENAI_MAX_FINAL_SCRIPT_ROUNDS || '5' }}
        OPENAI_MAX_REPAIR_ROUNDS: ${{ vars.AI_FACTORY_OPENAI_MAX_REPAIR_ROUNDS || '3' }}
        OPENAI_TOTAL_TIMEOUT_SECONDS: ${{ vars.AI_FACTORY_OPENAI_TOTAL_TIMEOUT_SECONDS || '1800' }}
        OPENAI_EXPLORATION_REQUEST_TIMEOUT_SECONDS: ${{ vars.AI_FACTORY_EXPLORATION_REQUEST_TIMEOUT_SECONDS || '180' }}
        OPENAI_FINAL_REQUEST_TIMEOUT_SECONDS: ${{ vars.AI_FACTORY_FINAL_REQUEST_TIMEOUT_SECONDS || '90' }}
        OPENAI_REPAIR_REQUEST_TIMEOUT_SECONDS: ${{ vars.AI_FACTORY_REPAIR_REQUEST_TIMEOUT_SECONDS || '90' }}
      run: bash factory/components/agent-sandbox-images/coding-agent/ai-factory-agent openai-compatible --check-config

    - name: Create kind cluster
      uses: helm/kind-action@v1.12.0
      with:
        cluster_name: ${{ env.KIND_CLUSTER_NAME }}

    - name: Install FactoryTask and agent-sandbox
      run: |
        factory/components/factory-task/install
        git clone --depth=1 https://github.com/kubernetes-sigs/agent-sandbox.git "${AGENT_SANDBOX_SRC}"
        IMAGE_PREFIX=ai-factory IMAGE_TAG=ci KIND_CLUSTER_NAME="${KIND_CLUSTER_NAME}" \
          AGENT_SANDBOX_SRC="${AGENT_SANDBOX_SRC}" factory/components/agent-sandbox/install

    - name: Build coding agent sandbox image
      run: |
        GO_VERSION="$(awk '/^go / {print $2; exit}' factory/go.mod)"
        INSTALL_CODEX_CLI=false
        if [[ "${AGENT_COMMAND}" == *"codex"* ]]; then
          INSTALL_CODEX_CLI=true
        fi
        docker build \
          --build-arg GO_VERSION="${GO_VERSION}" \
          --build-arg INSTALL_CODEX_CLI="${INSTALL_CODEX_CLI}" \
          -t "${CODING_AGENT_IMAGE}" \
          factory/components/agent-sandbox-images/coding-agent
        kind load docker-image "${CODING_AGENT_IMAGE}" --name "${KIND_CLUSTER_NAME}"

    - name: Create sandbox warm pool
      run: |
        cat > "${RUNNER_TEMP}/go-dev-sandbox.yaml" <<EOF
        apiVersion: extensions.agents.x-k8s.io/v1beta1
        kind: SandboxTemplate
        metadata:
          name: go-dev
          namespace: default
        spec:
          envVarsInjectionPolicy: Allowed
          networkPolicyManagement: Unmanaged
          podTemplate:
            spec:
              containers:
              - name: dev
                image: ${CODING_AGENT_IMAGE}
                imagePullPolicy: IfNotPresent
                command:
                - /bin/bash
                - -lc
                - mkdir -p /workspace && sleep 3600
                workingDir: /workspace
        ---
        apiVersion: extensions.agents.x-k8s.io/v1beta1
        kind: SandboxWarmPool
        metadata:
          name: go-dev
          namespace: default
        spec:
          replicas: 1
          sandboxTemplateRef:
            name: go-dev
        EOF
        kubectl apply -f "${RUNNER_TEMP}/go-dev-sandbox.yaml"
        kubectl wait sandboxwarmpool go-dev -n default \
          --for=jsonpath='{.status.readyReplicas}'=1 --timeout=180s

    - name: Run FactoryTask
      env:
        FACTORY_REPOSITORY: ${{ env.FORK_REPO }}
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        AI_FACTORY_GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        OPENAI_API_KEY: ${{ secrets.AI_FACTORY_OPENAI_API_KEY }}
        OPENAI_BASE_URL: ${{ vars.AI_FACTORY_OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
        OPENAI_MODEL: ${{ vars.AI_FACTORY_OPENAI_MODEL || 'gpt-4.1' }}
        OPENAI_TEMPERATURE: ${{ vars.AI_FACTORY_OPENAI_TEMPERATURE || '1' }}
        OPENAI_MAX_TOKENS: ${{ vars.AI_FACTORY_OPENAI_MAX_TOKENS || '48000' }}
        OPENAI_MAX_TOOL_ROUNDS: ${{ vars.AI_FACTORY_OPENAI_MAX_TOOL_ROUNDS || '40' }}
        OPENAI_MAX_FINAL_SCRIPT_ROUNDS: ${{ vars.AI_FACTORY_OPENAI_MAX_FINAL_SCRIPT_ROUNDS || '5' }}
        OPENAI_MAX_REPAIR_ROUNDS: ${{ vars.AI_FACTORY_OPENAI_MAX_REPAIR_ROUNDS || '3' }}
        OPENAI_TOTAL_TIMEOUT_SECONDS: ${{ vars.AI_FACTORY_OPENAI_TOTAL_TIMEOUT_SECONDS || '1800' }}
        OPENAI_EXPLORATION_REQUEST_TIMEOUT_SECONDS: ${{ vars.AI_FACTORY_EXPLORATION_REQUEST_TIMEOUT_SECONDS || '180' }}
        OPENAI_FINAL_REQUEST_TIMEOUT_SECONDS: ${{ vars.AI_FACTORY_FINAL_REQUEST_TIMEOUT_SECONDS || '90' }}
        OPENAI_REPAIR_REQUEST_TIMEOUT_SECONDS: ${{ vars.AI_FACTORY_REPAIR_REQUEST_TIMEOUT_SECONDS || '90' }}
      run: |
        TASK_REPOSITORY="$(printf '%s' "${FORK_REPO}" | tr '[:upper:]/_' '[:lower:]--')"
        TASK_NAME="github-${TASK_REPOSITORY}-${ISSUE_NUMBER}"

        CHANGE_REQUEST=false
        AGENT_CMD="cat >/tmp/ai-factory-agent-prompt.txt"
        AGENT_ENV_ARGS=()
        TASK_COMMAND="test -s /tmp/ai-factory-agent-prompt.txt && git --version && go version && node --version && python3 --version && command -v ai-factory-agent"
        RESULT_EXPECTATION="FactoryTask to succeed"

        TRIGGER_LABEL="${{ steps.fetch-issue.outputs.trigger_label }}"
        if [[ "${TRIGGER_LABEL}" == "ai-factory-smoke" ]]; then
          CHANGE_REQUEST=true
          TASK_COMMAND="mkdir -p .ai-factory/smoke && printf 'issue=%s\nrun=%s\n' '${ISSUE_NUMBER}' '${GITHUB_RUN_ID}' > .ai-factory/smoke/issue-${ISSUE_NUMBER}.txt && ${TASK_COMMAND}"
          RESULT_EXPECTATION="an ai-factory-smoke change request URL or an existing PR status"
        elif [[ "${TRIGGER_LABEL}" == "ai-factory-run" ]]; then
          CHANGE_REQUEST=true
          if [[ "${AGENT_COMMAND}" == *"openai-compatible"* && -z "${OPENAI_API_KEY}" ]]; then
            echo "::error::AI_FACTORY_OPENAI_API_KEY secret is required for openai-compatible agent."
            exit 1
          fi
          AGENT_CMD="${AGENT_COMMAND}"
          AGENT_ENV_ARGS+=(--agent-env OPENAI_API_KEY)
          AGENT_ENV_ARGS+=(--agent-env OPENAI_BASE_URL)
          AGENT_ENV_ARGS+=(--agent-env OPENAI_MODEL)
          AGENT_ENV_ARGS+=(--agent-env OPENAI_TEMPERATURE)
          AGENT_ENV_ARGS+=(--agent-env OPENAI_MAX_TOKENS)
          AGENT_ENV_ARGS+=(--agent-env OPENAI_MAX_TOOL_ROUNDS)
          AGENT_ENV_ARGS+=(--agent-env OPENAI_MAX_FINAL_SCRIPT_ROUNDS)
          AGENT_ENV_ARGS+=(--agent-env OPENAI_MAX_REPAIR_ROUNDS)
          AGENT_ENV_ARGS+=(--agent-env OPENAI_TOTAL_TIMEOUT_SECONDS)
          AGENT_ENV_ARGS+=(--agent-env OPENAI_EXPLORATION_REQUEST_TIMEOUT_SECONDS)
          AGENT_ENV_ARGS+=(--agent-env OPENAI_FINAL_REQUEST_TIMEOUT_SECONDS)
          AGENT_ENV_ARGS+=(--agent-env OPENAI_REPAIR_REQUEST_TIMEOUT_SECONDS)
          TASK_COMMAND="${VALIDATION_COMMAND}"
          RESULT_EXPECTATION="an ai-factory-run change request URL or an existing PR status"
        fi

        # Build webhook payload pointing to FORK (not original repo)
        # This ensures FactoryTask clones the fork, and change-request pushes to the fork
        gh api "repos/${TARGET_REPO}/issues/${ISSUE_NUMBER}" > "${RUNNER_TEMP}/issue.json"
        gh api "repos/${FORK_REPO}" > "${RUNNER_TEMP}/repository.json"
        jq -n \
          --slurpfile issue "${RUNNER_TEMP}/issue.json" \
          --slurpfile repository "${RUNNER_TEMP}/repository.json" \
          '{
            action: "opened",
            issue: $issue[0],
            repository: {
              full_name: $repository[0].full_name,
              html_url: $repository[0].html_url,
              clone_url: $repository[0].clone_url,
              default_branch: $repository[0].default_branch
            }
          }' > "${RUNNER_TEMP}/github-issue.json"

        echo "Webhook payload repository:"
        jq '.repository.full_name' "${RUNNER_TEMP}/github-issue.json"

        # Run webhook server from factory directory (go.mod is there)
        # FactoryTask clones from clone_url in payload (fork), not local directory
        cd factory
        go run ./factory/cmd/factory task webhook serve \
          --addr 127.0.0.1:8080 \
          --apply \
          --repository "${FORK_REPO}" \
          --trigger-action opened \
          --trigger-action reopened \
          --trigger-action labeled \
          --require-label ai-factory \
          --sandbox-template go-dev \
          --agent-command "${AGENT_CMD}" \
          "${AGENT_ENV_ARGS[@]}" \
          --command "${TASK_COMMAND}" \
          --change-request="${CHANGE_REQUEST}" \
          --change-request-auth-token-env AI_FACTORY_GITHUB_TOKEN \
          --reporting-mode comment \
          > "${RUNNER_TEMP}/webhook.log" 2>&1 &
        WEBHOOK_PID=$!
        trap 'kill "${WEBHOOK_PID}" 2>/dev/null || true' EXIT

        WEBHOOK_DELIVERED=false
        for _ in $(seq 1 30); do
          if curl -fsS -X POST http://127.0.0.1:8080/webhook/github \
            -H 'Content-Type: application/json' \
            --data-binary @"${RUNNER_TEMP}/github-issue.json"; then
            WEBHOOK_DELIVERED=true
            break
          fi
          sleep 1
        done
        if [[ "${WEBHOOK_DELIVERED}" != "true" ]]; then
          cat "${RUNNER_TEMP}/webhook.log"
          exit 1
        fi

        kubectl get factorytask "${TASK_NAME}" -n default -o yaml

        go run ./factory/cmd/factory task controller watch \
          -n default \
          --once \
          --interval=1s \
          --timeout=180s \
          --create-change-request="${CHANGE_REQUEST}" \
          --report=true

        TASK_PHASE=""
        for _ in $(seq 1 90); do
          TASK_PHASE="$(kubectl get factorytask "${TASK_NAME}" -n default -o jsonpath='{.status.phase}' 2>/dev/null || true)"
          if [[ "${TASK_PHASE}" == "Succeeded" || "${TASK_PHASE}" == "Failed" ]]; then
            break
          fi
          sleep 2
        done
        kubectl get factorytask "${TASK_NAME}" -n default -o yaml
        if [[ "${TASK_PHASE}" != "Succeeded" ]]; then
          echo "::error::FactoryTask did not succeed. Phase: ${TASK_PHASE:-<empty>}"
          exit 1
        fi
        if [[ "${CHANGE_REQUEST}" == "true" ]]; then
          LAST_RESULT_URL="$(kubectl get factorytask "${TASK_NAME}" -n default -o jsonpath='{.status.lastResultURL}')"
          LAST_MESSAGE="$(kubectl get factorytask "${TASK_NAME}" -n default -o jsonpath='{.status.lastMessage}')"
          if [[ -z "${LAST_RESULT_URL}" && "${LAST_MESSAGE}" != *"Change request already exists"* ]]; then
            kubectl get factorytask "${TASK_NAME}" -n default -o yaml
            echo "::error::Expected ${RESULT_EXPECTATION}."
            exit 1
          fi
        fi

    - name: Create PR from fork to upstream
      if: success()
      run: |
        RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

        # Check if PR already exists
        EXISTING_PR=$(gh pr list --repo "${TARGET_REPO}" \
          --head "${FORK_OWNER}:${BRANCH_NAME}" \
          --state open \
          --json number --jq 'length')

        if [[ "$EXISTING_PR" -gt 0 ]]; then
          echo "PR already exists for ${FORK_OWNER}:${BRANCH_NAME}, skipping."
        else
          # Check if the branch exists on the fork (change-request flow should have pushed it)
          if gh api "repos/${FORK_REPO}/branches/${BRANCH_NAME}" >/dev/null 2>&1; then
            echo "Creating PR from ${FORK_OWNER}:${BRANCH_NAME} to ${TARGET_REPO}:${BASE_REF}..."
            gh pr create \
              --repo "${TARGET_REPO}" \
              --head "${FORK_OWNER}:${BRANCH_NAME}" \
              --base "${BASE_REF}" \
              --title "ai-factory: fix issue #${ISSUE_NUMBER}" \
              --body "$(cat <<EOF
        ## ai-factory automated fix

        Resolves #${ISSUE_NUMBER}

        - **Actions run:** ${RUN_URL}
        - **Trigger:** \`${{ steps.fetch-issue.outputs.trigger_label }}\`
        - **Fork:** ${FORK_REPO}

        ---
        *This PR was generated automatically by [ai-factory](https://github.com/Verdure-oss/ai-factory).*
        EOF
        )"
            echo "PR created successfully."
          else
            echo "::warning::Branch ${BRANCH_NAME} not found on ${FORK_REPO}. Change-request flow may not have pushed changes."
          fi
        fi

    - name: Comment on target issue
      if: success()
      run: |
        RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

        COMMENT_BODY="## ai-factory result: Succeeded\n\n"
        COMMENT_BODY+="- **Target:** \`${TARGET_REPO}\` #${ISSUE_NUMBER}\n"
        COMMENT_BODY+="- **Actions run:** ${RUN_URL}\n"
        COMMENT_BODY+="- **Fork:** ${FORK_REPO}\n"
        COMMENT_BODY+="- **Branch:** ${BRANCH_NAME}\n"
        COMMENT_BODY+="\nA pull request has been created from the fork.\n"

        # Try to comment (may fail if repo doesn't allow external comments)
        gh api "repos/${TARGET_REPO}/issues/${ISSUE_NUMBER}/comments" \
          -f body="$(echo -e "${COMMENT_BODY}")" 2>/dev/null || \
          echo "::warning::Could not comment on issue #${ISSUE_NUMBER}. The repository may not allow external comments."

    - name: Report failure
      if: failure()
      run: |
        RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

        PHASE=""
        REASON=""
        MESSAGE=""
        TASK_REPOSITORY="$(printf '%s' "${FORK_REPO}" | tr '[:upper:]/_' '[:lower:]--')"
        TASK_NAME="github-${TASK_REPOSITORY}-${ISSUE_NUMBER}"
        if kubectl get factorytask "${TASK_NAME}" -n default >/dev/null 2>&1; then
          PHASE="$(kubectl get factorytask "${TASK_NAME}" -n default -o jsonpath='{.status.phase}' 2>/dev/null || true)"
          REASON="$(kubectl get factorytask "${TASK_NAME}" -n default -o jsonpath='{.status.conditions[-1:].reason}' 2>/dev/null || true)"
          MESSAGE="$(kubectl get factorytask "${TASK_NAME}" -n default -o jsonpath='{.status.lastMessage}' 2>/dev/null || true)"
        fi

        if [[ -z "${PHASE}" ]]; then PHASE="WorkflowFailed"; fi
        if [[ -z "${REASON}" ]]; then REASON="WorkflowFailed"; fi
        if [[ -z "${MESSAGE}" ]]; then MESSAGE="Check the Actions run logs."; fi

        COMMENT_BODY="## ai-factory result: Failed\n\n"
        COMMENT_BODY+="- **Target:** \`${TARGET_REPO}\` #${ISSUE_NUMBER}\n"
        COMMENT_BODY+="- **Actions run:** ${RUN_URL}\n"
        COMMENT_BODY+="- **Phase:** ${PHASE}\n"
        COMMENT_BODY+="- **Reason:** ${REASON}\n"
        COMMENT_BODY+="\n### Message\n\n${MESSAGE}\n"

        # Try to comment (may fail)
        gh api "repos/${TARGET_REPO}/issues/${ISSUE_NUMBER}/comments" \
          -f body="$(echo -e "${COMMENT_BODY}")" 2>/dev/null || \
          echo "::warning::Could not comment on issue #${ISSUE_NUMBER}."

    - name: Show FactoryTask status
      if: always()
      run: |
        kubectl get factorytasks,sandboxclaims,sandboxwarmpools,pods -A || true
        TASK_REPOSITORY="$(printf '%s' "${FORK_REPO}" | tr '[:upper:]/_' '[:lower:]--')"
        kubectl get factorytask "github-${TASK_REPOSITORY}-${ISSUE_NUMBER}" -n default -o yaml || true

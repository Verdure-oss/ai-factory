name: Webhook Receiver

# 触发条件：workflow_dispatch（由目标仓库的 bridge workflow 调用）
on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Target repository (owner/repo)'
        required: true
        type: string
      issue_number:
        description: 'Issue number'
        required: true
        type: string
      action:
        description: 'Event action (labeled/opened/closed/reopened)'
        required: true
        type: string
      label_name:
        description: 'Label name (for labeled action)'
        required: false
        default: ''
        type: string
      sender:
        description: 'Sender login'
        required: true
        type: string

# 权限配置
permissions:
  contents: read
  actions: write
  issues: read

# 并发控制
concurrency:
  group: webhook-receiver-${{ inputs.issue_number }}
  cancel-in-progress: true

jobs:
  # 接收事件并触发主 workflow
  receive-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Parse event payload
        id: parse
        run: |
          echo "解析事件负载..."

          REPOSITORY="${{ inputs.repository }}"
          ISSUE_NUMBER="${{ inputs.issue_number }}"
          ACTION="${{ inputs.action }}"
          LABEL_NAME="${{ inputs.label_name }}"
          SENDER="${{ inputs.sender }}"

          echo "仓库: ${REPOSITORY}"
          echo "Issue: #${ISSUE_NUMBER}"
          echo "动作: ${ACTION}"
          echo "标签: ${LABEL_NAME}"
          echo "触发者: ${SENDER}"

          # 设置输出
          echo "repository=${REPOSITORY}" >> $GITHUB_OUTPUT
          echo "issue_number=${ISSUE_NUMBER}" >> $GITHUB_OUTPUT
          echo "action=${ACTION}" >> $GITHUB_OUTPUT
          echo "label_name=${LABEL_NAME}" >> $GITHUB_OUTPUT
          echo "sender=${SENDER}" >> $GITHUB_OUTPUT

      - name: Check label eligibility
        id: check-label
        run: |
          echo "检查标签资格..."

          ACTION="${{ steps.parse.outputs.action }}"
          LABEL_NAME="${{ steps.parse.outputs.label_name }}"

          # 如果是 labeled 事件，检查是否是触发标签
          if [[ "${ACTION}" == "labeled" ]]; then
            case "${LABEL_NAME}" in
              ai-factory-run)
                echo "✓ 触发正式运行"
                echo "trigger_type=run" >> $GITHUB_OUTPUT
                echo "should_trigger=true" >> $GITHUB_OUTPUT
                ;;
              ai-factory-smoke)
                echo "✓ 触发冒烟测试"
                echo "trigger_type=smoke" >> $GITHUB_OUTPUT
                echo "should_trigger=true" >> $GITHUB_OUTPUT
                ;;
              ai-factory)
                echo "✓ 基础标签，等待 run/smoke 标签"
                echo "trigger_type=base" >> $GITHUB_OUTPUT
                echo "should_trigger=false" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "跳过: 非触发标签: ${LABEL_NAME}"
                echo "trigger_type=none" >> $GITHUB_OUTPUT
                echo "should_trigger=false" >> $GITHUB_OUTPUT
                ;;
            esac
          else
            # 对于非 labeled 事件，检查是否已有 ai-factory 标签
            echo "检查 Issue 是否有 ai-factory 标签..."
            echo "trigger_type=other" >> $GITHUB_OUTPUT
            echo "should_trigger=false" >> $GITHUB_OUTPUT
          fi

      - name: Send repository_dispatch
        id: dispatch
        if: steps.check-label.outputs.should_trigger == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "发送 repository_dispatch 事件..."

          REPOSITORY="${{ steps.parse.outputs.repository }}"
          ISSUE_NUMBER="${{ steps.parse.outputs.issue_number }}"
          ACTION="${{ steps.parse.outputs.action }}"
          LABEL_NAME="${{ steps.parse.outputs.label_name }}"
          SENDER="${{ steps.parse.outputs.sender }}"
          TRIGGER_TYPE="${{ steps.check-label.outputs.trigger_type }}"

          # 构造 payload
          PAYLOAD=$(cat <<EOF
          {
            "event_type": "issue-${ACTION}",
            "client_payload": {
              "repository": "${REPOSITORY}",
              "issue_number": ${ISSUE_NUMBER},
              "action": "${ACTION}",
              "label_name": "${LABEL_NAME}",
              "sender": "${SENDER}",
              "trigger_type": "${TRIGGER_TYPE}",
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }
          }
          EOF
          )

          echo "Payload:"
          echo "${PAYLOAD}" | jq .

          # 发送 repository_dispatch
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches")

          HTTP_CODE=$(echo "${RESPONSE}" | tail -n1)
          BODY=$(echo "${RESPONSE}" | sed '$d')

          if [[ "${HTTP_CODE}" -ge 200 && "${HTTP_CODE}" -lt 300 ]]; then
            echo "✓ repository_dispatch 发送成功"
            echo "dispatch_sent=true" >> $GITHUB_OUTPUT
          else
            echo "错误: repository_dispatch 发送失败"
            echo "HTTP 状态码: ${HTTP_CODE}"
            echo "响应: ${BODY}"
            echo "dispatch_sent=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Log dispatch result
        if: steps.check-label.outputs.should_trigger == 'true'
        run: |
          echo "=========================================="
          echo "Webhook 处理结果"
          echo "=========================================="
          echo "仓库: ${{ steps.parse.outputs.repository }}"
          echo "Issue: #${{ steps.parse.outputs.issue_number }}"
          echo "动作: ${{ steps.parse.outputs.action }}"
          echo "标签: ${{ steps.parse.outputs.label_name }}"
          echo "触发者: ${{ steps.parse.outputs.sender }}"
          echo "触发类型: ${{ steps.check-label.outputs.trigger_type }}"
          echo "Dispatch 发送: ${{ steps.dispatch.outputs.dispatch_sent }}"
          echo "=========================================="

      - name: Skip notification
        if: steps.check-label.outputs.should_trigger != 'true'
        run: |
          echo "=========================================="
          echo "跳过处理"
          echo "=========================================="
          echo "仓库: ${{ steps.parse.outputs.repository }}"
          echo "Issue: #${{ steps.parse.outputs.issue_number }}"
          echo "动作: ${{ steps.parse.outputs.action }}"
          echo "标签: ${{ steps.parse.outputs.label_name }}"
          echo "原因: 非触发标签或条件不满足"
          echo "=========================================="

name: Webhook Receiver

# 触发条件：GitHub App 发送的 workflow_dispatch 事件
on:
  workflow_dispatch:
    inputs:
      repository:
        description: '目标仓库 (格式: owner/repo)'
        required: true
        type: string
      issue_number:
        description: 'Issue 编号'
        required: true
        type: number
      action:
        description: '触发动作 (labeled/opened/closed)'
        required: true
        type: string
      label_name:
        description: '标签名称 (如果是 labeled 事件)'
        required: false
        type: string
      sender:
        description: '触发者用户名'
        required: true
        type: string

# 权限配置
permissions:
  contents: read
  actions: write
  issues: read

# 并发控制
concurrency:
  group: webhook-receiver-${{ inputs.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: true

jobs:
  # 接收事件并触发主 workflow
  receive-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate inputs
        id: validate
        run: |
          echo "验证输入参数..."

          # 验证仓库格式
          if [[ ! "${{ inputs.repository }}" =~ ^[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+$ ]]; then
            echo "错误: 仓库格式不正确，应为 owner/repo"
            exit 1
          fi

          # 验证 Issue 编号
          if [[ "${{ inputs.issue_number }}" -le 0 ]]; then
            echo "错误: Issue 编号必须大于 0"
            exit 1
          fi

          # 验证动作
          if [[ ! "${{ inputs.action }}" =~ ^(labeled|opened|closed|reopened)$ ]]; then
            echo "错误: 不支持的动作: ${{ inputs.action }}"
            exit 1
          fi

          # 验证标签（如果是 labeled 事件）
          if [[ "${{ inputs.action }}" == "labeled" ]]; then
            if [[ -z "${{ inputs.label_name }}" ]]; then
              echo "错误: labeled 事件必须提供标签名称"
              exit 1
            fi

            # 检查是否是 ai-factory 相关标签
            if [[ ! "${{ inputs.label_name }}" =~ ^ai-factory ]]; then
              echo "跳过: 非 ai-factory 标签: ${{ inputs.label_name }}"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "✓ 输入参数验证通过"
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Check label eligibility
        id: check-label
        if: steps.validate.outputs.skip != 'true'
        run: |
          echo "检查标签资格..."

          REPOSITORY="${{ inputs.repository }}"
          ISSUE_NUMBER="${{ inputs.issue_number }}"
          ACTION="${{ inputs.action }}"
          LABEL_NAME="${{ inputs.label_name }}"
          SENDER="${{ inputs.sender }}"

          # 如果是 labeled 事件，检查是否是触发标签
          if [[ "${ACTION}" == "labeled" ]]; then
            case "${LABEL_NAME}" in
              ai-factory-run)
                echo "✓ 触发正式运行"
                echo "trigger_type=run" >> $GITHUB_OUTPUT
                echo "should_trigger=true" >> $GITHUB_OUTPUT
                ;;
              ai-factory-smoke)
                echo "✓ 触发冒烟测试"
                echo "trigger_type=smoke" >> $GITHUB_OUTPUT
                echo "should_trigger=true" >> $GITHUB_OUTPUT
                ;;
              ai-factory)
                echo "✓ 基础标签，等待 run/smoke 标签"
                echo "trigger_type=base" >> $GITHUB_OUTPUT
                echo "should_trigger=false" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "跳过: 非触发标签: ${LABEL_NAME}"
                echo "trigger_type=none" >> $GITHUB_OUTPUT
                echo "should_trigger=false" >> $GITHUB_OUTPUT
                ;;
            esac
          else
            # 对于非 labeled 事件，检查是否已有 ai-factory 标签
            echo "检查 Issue 是否有 ai-factory 标签..."
            echo "trigger_type=other" >> $GITHUB_OUTPUT
            echo "should_trigger=false" >> $GITHUB_OUTPUT
          fi

      - name: Send repository_dispatch
        id: dispatch
        if: steps.check-label.outputs.should_trigger == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "发送 repository_dispatch 事件..."

          REPOSITORY="${{ inputs.repository }}"
          ISSUE_NUMBER="${{ inputs.issue_number }}"
          ACTION="${{ inputs.action }}"
          LABEL_NAME="${{ inputs.label_name }}"
          SENDER="${{ inputs.sender }}"
          TRIGGER_TYPE="${{ steps.check-label.outputs.trigger_type }}"

          # 构造 payload
          PAYLOAD=$(cat <<EOF
          {
            "event_type": "issue-${ACTION}",
            "client_payload": {
              "repository": "${REPOSITORY}",
              "issue_number": ${ISSUE_NUMBER},
              "action": "${ACTION}",
              "label_name": "${LABEL_NAME}",
              "sender": "${SENDER}",
              "trigger_type": "${TRIGGER_TYPE}",
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }
          }
          EOF
          )

          echo "Payload:"
          echo "${PAYLOAD}" | jq .

          # 发送 repository_dispatch
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches")

          HTTP_CODE=$(echo "${RESPONSE}" | tail -n1)
          BODY=$(echo "${RESPONSE}" | sed '$d')

          if [[ "${HTTP_CODE}" -ge 200 && "${HTTP_CODE}" -lt 300 ]]; then
            echo "✓ repository_dispatch 发送成功"
            echo "dispatch_sent=true" >> $GITHUB_OUTPUT
          else
            echo "错误: repository_dispatch 发送失败"
            echo "HTTP 状态码: ${HTTP_CODE}"
            echo "响应: ${BODY}"
            echo "dispatch_sent=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Log dispatch result
        if: steps.check-label.outputs.should_trigger == 'true'
        run: |
          echo "=========================================="
          echo "Webhook 处理结果"
          echo "=========================================="
          echo "仓库: ${{ inputs.repository }}"
          echo "Issue: #${{ inputs.issue_number }}"
          echo "动作: ${{ inputs.action }}"
          echo "标签: ${{ inputs.label_name }}"
          echo "触发者: ${{ inputs.sender }}"
          echo "触发类型: ${{ steps.check-label.outputs.trigger_type }}"
          echo "Dispatch 发送: ${{ steps.dispatch.outputs.dispatch_sent }}"
          echo "=========================================="

      - name: Skip notification
        if: steps.check-label.outputs.should_trigger != 'true'
        run: |
          echo "=========================================="
          echo "跳过处理"
          echo "=========================================="
          echo "仓库: ${{ inputs.repository }}"
          echo "Issue: #${{ inputs.issue_number }}"
          echo "动作: ${{ inputs.action }}"
          echo "标签: ${{ inputs.label_name }}"
          echo "原因: 非触发标签或条件不满足"
          echo "=========================================="

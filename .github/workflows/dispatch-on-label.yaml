name: Dispatch on Label

# 触发条件：Issue 被打上标签
on:
  issues:
    types:
      - labeled

# 权限配置
permissions:
  contents: read
  actions: write
  issues: read

# 并发控制
concurrency:
  group: dispatch-on-label-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # 发送 repository_dispatch 事件到 ai-factory 仓库
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check label eligibility
        id: check-label
        run: |
          echo "检查标签资格..."

          LABEL_NAME="${{ github.event.label.name }}"
          ACTION="${{ github.event.action }}"

          # 如果是 labeled 事件，检查是否是触发标签
          if [[ "${ACTION}" == "labeled" ]]; then
            case "${LABEL_NAME}" in
              ai-factory-run)
                echo "✓ 触发正式运行"
                echo "trigger_type=run" >> $GITHUB_OUTPUT
                echo "should_trigger=true" >> $GITHUB_OUTPUT
                ;;
              ai-factory-smoke)
                echo "✓ 触发冒烟测试"
                echo "trigger_type=smoke" >> $GITHUB_OUTPUT
                echo "should_trigger=true" >> $GITHUB_OUTPUT
                ;;
              ai-factory)
                echo "✓ 基础标签，等待 run/smoke 标签"
                echo "trigger_type=base" >> $GITHUB_OUTPUT
                echo "should_trigger=false" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "跳过: 非触发标签: ${LABEL_NAME}"
                echo "trigger_type=none" >> $GITHUB_OUTPUT
                echo "should_trigger=false" >> $GITHUB_OUTPUT
                ;;
            esac
          else
            echo "跳过: 非 labeled 事件"
            echo "trigger_type=none" >> $GITHUB_OUTPUT
            echo "should_trigger=false" >> $GITHUB_OUTPUT
          fi

      - name: Send repository_dispatch
        id: dispatch
        if: steps.check-label.outputs.should_trigger == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.AI_FACTORY_GITHUB_TOKEN }}
        run: |
          echo "发送 repository_dispatch 事件..."

          REPOSITORY="${{ github.repository }}"
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          ACTION="${{ github.event.action }}"
          LABEL_NAME="${{ github.event.label.name }}"
          SENDER="${{ github.event.sender.login }}"
          TRIGGER_TYPE="${{ steps.check-label.outputs.trigger_type }}"

          # 构造 payload
          PAYLOAD=$(cat <<EOF
          {
            "event_type": "issue-${ACTION}",
            "client_payload": {
              "repository": "${REPOSITORY}",
              "issue_number": ${ISSUE_NUMBER},
              "action": "${ACTION}",
              "label_name": "${LABEL_NAME}",
              "sender": "${SENDER}",
              "trigger_type": "${TRIGGER_TYPE}",
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }
          }
          EOF
          )

          echo "Payload:"
          echo "${PAYLOAD}" | jq .

          # 发送 repository_dispatch 到 ai-factory 仓库
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "https://api.github.com/repos/Verdure-oss/ai-factory/dispatches")

          HTTP_CODE=$(echo "${RESPONSE}" | tail -n1)
          BODY=$(echo "${RESPONSE}" | sed '$d')

          if [[ "${HTTP_CODE}" -ge 200 && "${HTTP_CODE}" -lt 300 ]]; then
            echo "✓ repository_dispatch 发送成功"
            echo "dispatch_sent=true" >> $GITHUB_OUTPUT
          else
            echo "错误: repository_dispatch 发送失败"
            echo "HTTP 状态码: ${HTTP_CODE}"
            echo "响应: ${BODY}"
            echo "dispatch_sent=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Log result
        if: steps.check-label.outputs.should_trigger == 'true'
        run: |
          echo "=========================================="
          echo "Dispatch 处理结果"
          echo "=========================================="
          echo "仓库: ${{ github.repository }}"
          echo "Issue: #${{ github.event.issue.number }}"
          echo "动作: ${{ github.event.action }}"
          echo "标签: ${{ github.event.label.name }}"
          echo "触发者: ${{ github.event.sender.login }}"
          echo "触发类型: ${{ steps.check-label.outputs.trigger_type }}"
          echo "Dispatch 发送: ${{ steps.dispatch.outputs.dispatch_sent }}"
          echo "=========================================="

      - name: Skip notification
        if: steps.check-label.outputs.should_trigger != 'true'
        run: |
          echo "=========================================="
          echo "跳过处理"
          echo "=========================================="
          echo "仓库: ${{ github.repository }}"
          echo "Issue: #${{ github.event.issue.number }}"
          echo "动作: ${{ github.event.action }}"
          echo "标签: ${{ github.event.label.name }}"
          echo "原因: 非触发标签或条件不满足"
          echo "=========================================="

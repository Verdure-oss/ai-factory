name: Publish

permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/verdure-oss

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version (strip leading v)
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "resolved version: ${VERSION}"
          # Helm chart version 必须是 SemVer；非 tag 触发（workflow_dispatch）
          # 会拿到短 SHA，需转成合法的 prerelease 版本
          if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            CHART_VERSION="${VERSION}"
          else
            CHART_VERSION="0.0.0-dev.${VERSION}"
          fi
          echo "chartVersion=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "resolved chartVersion: ${CHART_VERSION}"

      # --- 1. ai-factory-server ---
      - name: Build and push ai-factory-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.server
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/verdure-oss/ai-factory-server:${{ steps.version.outputs.version }}
            ghcr.io/verdure-oss/ai-factory-server:latest

      # --- 2. coding-agent-sandbox ---
      - name: Build and push coding-agent-sandbox
        uses: docker/build-push-action@v6
        with:
          context: ./components/agent-sandbox-images/coding-agent
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GO_VERSION=1.25.12
            INSTALL_CODEX_CLI=true
          tags: |
            ghcr.io/verdure-oss/coding-agent-sandbox:${{ steps.version.outputs.version }}
            ghcr.io/verdure-oss/coding-agent-sandbox:latest

      # --- 3. agent-sandbox-controller ---
      - name: Clone agent-sandbox
        run: git clone --depth=1 https://github.com/kubernetes-sigs/agent-sandbox.git /tmp/agent-sandbox

      - name: Build and push agent-sandbox-controller
        uses: docker/build-push-action@v6
        with:
          context: /tmp/agent-sandbox
          file: /tmp/agent-sandbox/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/verdure-oss/agent-sandbox-controller:${{ steps.version.outputs.version }}
            ghcr.io/verdure-oss/agent-sandbox-controller:latest

      # --- 4. Helm chart (OCI) ---
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Package and push Helm chart
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHART_VERSION="${{ steps.version.outputs.chartVersion }}"
          # --version 必须是 SemVer；非 tag 触发时 CHART_VERSION 为 0.0.0-dev.<sha>
          helm package charts/ai-factory --version "${CHART_VERSION}" --app-version "${VERSION}" -d /tmp/chart
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push /tmp/chart/ai-factory-*.tgz oci://ghcr.io/verdure-oss/charts

apiVersion: v1
kind: Service
metadata:
  name: ai-factory-server
  namespace: {{ include "ai-factory.namespace" . }}
  labels:
    {{- include "ai-factory.labels" . | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  selector:
    {{- include "ai-factory.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
  - port: {{ .Values.server.service.port }}
    targetPort: http
    protocol: TCP
    name: http

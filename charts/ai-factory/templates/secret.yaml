apiVersion: v1
kind: Secret
metadata:
  name: ai-factory-credentials
  namespace: {{ include "ai-factory.namespace" . }}
  labels:
    {{- include "ai-factory.labels" . | nindent 4 }}
type: Opaque
stringData:
  GITHUB_TOKEN: {{ .Values.github.token | quote }}
  WEBHOOK_SECRET: {{ .Values.webhook.secret | quote }}
  OPENAI_API_KEY: {{ .Values.openai.apiKey | quote }}
  CODEX_API_KEY: {{ .Values.openai.codexApiKey | quote }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-factory-server
  namespace: {{ include "ai-factory.namespace" . }}
  labels:
    {{- include "ai-factory.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-factory.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "ai-factory.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: ai-factory-server
      containers:
      - name: server
        image: {{ include "ai-factory.serverImage" . }}
        imagePullPolicy: {{ .Values.server.image.pullPolicy }}
        args:
        - server
        - --addr=:8080
        - --namespace={{ include "ai-factory.namespace" . }}
        - --agent={{ .Values.agent.name }}
        - --agent-command={{ .Values.agent.command }}
        - --smoke-agent-command={{ .Values.agent.smokeCommand }}
        {{- range .Values.agent.smokeCommands }}
        - --smoke-command={{ . }}
        {{- end }}
        {{- range .Values.agent.validationCommands }}
        - --validation-command={{ . }}
        {{- end }}
        - --sandbox-template=go-dev
        - --watch-interval={{ .Values.watchInterval }}
        - --task-timeout={{ .Values.taskTimeout }}
        - --max-concurrent-tasks={{ .Values.server.maxConcurrentTasks }}
        - --change-request={{ .Values.changeRequestEnabled }}
        - --report={{ .Values.reportEnabled }}
        {{- if .Values.github.forkOwner }}
        - --fork-owner={{ .Values.github.forkOwner }}
        {{- end }}
        {{- range .Values.github.repositoryAllowList }}
        - --repository={{ . }}
        {{- end }}
        - --agent-env=CODEX_API_KEY
        - --agent-env=OPENAI_API_KEY
        - --agent-env=OPENAI_BASE_URL
        - --agent-env=OPENAI_MODEL
        - --agent-env=OPENAI_TEMPERATURE
        - --agent-env=OPENAI_MAX_TOKENS
        - --agent-env=OPENAI_MAX_TOOL_ROUNDS
        - --agent-env=OPENAI_MAX_FINAL_SCRIPT_ROUNDS
        - --agent-env=OPENAI_MAX_REPAIR_ROUNDS
        - --agent-env=OPENAI_TOTAL_TIMEOUT_SECONDS
        - --agent-env=OPENAI_EXPLORATION_REQUEST_TIMEOUT_SECONDS
        - --agent-env=OPENAI_FINAL_REQUEST_TIMEOUT_SECONDS
        - --agent-env=OPENAI_REPAIR_REQUEST_TIMEOUT_SECONDS
        - --agent-env=OPENAI_VISION_ENABLED
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        volumeMounts:
        - name: secret-config
          mountPath: /etc/ai-factory/secret
          readOnly: true
        - name: configmap-config
          mountPath: /etc/ai-factory/config
          readOnly: true
        livenessProbe:
          {{- toYaml .Values.server.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.server.readinessProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.server.resources | nindent 12 }}
      volumes:
      - name: secret-config
        secret:
          secretName: ai-factory-credentials
      - name: configmap-config
        configMap:
          name: ai-factory-config

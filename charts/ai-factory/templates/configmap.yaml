apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-factory-config
  namespace: {{ include "ai-factory.namespace" . }}
  labels:
    {{- include "ai-factory.labels" . | nindent 4 }}
data:
  OPENAI_BASE_URL: {{ .Values.openai.baseUrl | quote }}
  OPENAI_MODEL: {{ .Values.openai.model | quote }}
  OPENAI_TEMPERATURE: {{ .Values.openai.temperature | quote }}
  OPENAI_MAX_TOKENS: {{ .Values.openai.maxTokens | quote }}
  OPENAI_MAX_TOOL_ROUNDS: {{ .Values.openai.maxToolRounds | quote }}
  OPENAI_MAX_FINAL_SCRIPT_ROUNDS: {{ .Values.openai.maxFinalScriptRounds | quote }}
  OPENAI_MAX_REPAIR_ROUNDS: {{ .Values.openai.maxRepairRounds | quote }}
  OPENAI_TOTAL_TIMEOUT_SECONDS: {{ .Values.openai.totalTimeoutSeconds | quote }}
  OPENAI_EXPLORATION_REQUEST_TIMEOUT_SECONDS: {{ .Values.openai.explorationRequestTimeoutSeconds | quote }}
  OPENAI_FINAL_REQUEST_TIMEOUT_SECONDS: {{ .Values.openai.finalRequestTimeoutSeconds | quote }}
  OPENAI_REPAIR_REQUEST_TIMEOUT_SECONDS: {{ .Values.openai.repairRequestTimeoutSeconds | quote }}
  OPENAI_VISION_ENABLED: {{ .Values.openai.visionEnabled | quote }}
  {{- if .Values.codex.model }}
  # Optional model override for Codex delegated mode (passed as `codex exec --model`).
  # Leave codex.model empty to use the model from auth.json / ~/.codex/config.toml.
  CODEX_MODEL: {{ .Values.codex.model | quote }}
  {{- end }}
  {{- if .Values.codex.plugin.source }}
  # Codex marketplace plugin providing the delegated workflow skills. The agent
  # runs `plugin marketplace add/upgrade` + `plugin add` per task, so a pushed
  # skill edit lands on the next task without a rebuild.
  AI_FACTORY_CODEX_PLUGIN_SOURCE: {{ .Values.codex.plugin.source | quote }}
  AI_FACTORY_CODEX_PLUGIN_NAME: {{ .Values.codex.plugin.name | quote }}
  AI_FACTORY_CODEX_MARKETPLACE_NAME: {{ .Values.codex.plugin.marketplace | quote }}
  AI_FACTORY_CODEX_PLUGIN_REF: {{ .Values.codex.plugin.ref | quote }}
  {{- end }}
  MAX_CONCURRENT_TASKS: {{ .Values.server.maxConcurrentTasks | quote }}
  CI_WATCH_ENABLED: {{ .Values.server.ciWatchEnabled | quote }}
  CI_WATCH_MAX_RETRIES: {{ .Values.server.ciWatchMaxRetries | quote }}
  CI_WATCH_MAX_WAIT: {{ .Values.server.ciWatchMaxWait | quote }}
  CI_WATCH_SETTLE_INTERVAL: {{ .Values.server.ciWatchSettleInterval | quote }}
  CI_WATCH_MAX_TOOL_ROUNDS: {{ .Values.server.ciWatchMaxToolRounds | quote }}
  CI_WATCH_LOG_SNIPPET_LINES: {{ .Values.server.ciWatchLogSnippetLines | quote }}
  {{- if .Values.gitProxy }}
  AI_FACTORY_GIT_PROXY: {{ .Values.gitProxy | quote }}
  {{- end }}
  {{- /* GIT_PROVIDER is required by the server at startup: it refuses to boot
       without it. Fail at install/upgrade time instead of letting the Pod
       crash-loop with an opaque error. */ -}}
  {{- if not (has (.Values.gitProvider | toString) (list "github" "gitlab")) }}
  {{- fail "gitProvider is required and must be \"github\" or \"gitlab\" (e.g. --set gitProvider=gitlab)" }}
  {{- end }}
  GIT_PROVIDER: {{ .Values.gitProvider | quote }}
  {{- if .Values.gitlab.apiBase }}
  GITLAB_API_BASE: {{ .Values.gitlab.apiBase | quote }}
  {{- end }}

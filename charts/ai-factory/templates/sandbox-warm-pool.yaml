apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: go-dev
  namespace: {{ include "ai-factory.namespace" . }}
  labels:
    {{- include "ai-factory.labels" . | nindent 4 }}
spec:
  envVarsInjectionPolicy: Allowed
  networkPolicyManagement: Unmanaged
  podTemplate:
    spec:
      containers:
      - name: {{ .Values.sandbox.containerName }}
        image: {{ include "ai-factory.sandboxImage" . }}
        imagePullPolicy: {{ .Values.sandbox.image.pullPolicy }}
        # Load runtime config (GITHUB_TOKEN, OPENAI_*, AI_FACTORY_GIT_PROXY, ...)
        # at go-dev creation time so the claim does not need to carry env.
        # Keeping claim.spec.env empty lets agent-sandbox adopt warm pool pods.
        envFrom:
        - secretRef:
            name: ai-factory-credentials
        - configMapRef:
            name: ai-factory-config
        command:
        - /bin/bash
        - -lc
        - mkdir -p /workspace && sleep 3600
        workingDir: /workspace
        {{- if or .Values.codex.authSecretName .Values.codex.skillConfigMapName }}
        volumeMounts:
        {{- if .Values.codex.authSecretName }}
        # Codex auth.json (from `codex login`) for delegated mode.
        - name: codex-auth
          mountPath: /home/agent/.codex/auth.json
          subPath: auth.json
          readOnly: true
        {{- end }}
        {{- if .Values.codex.skillConfigMapName }}
        # Externally editable issue-fix workflow skill (override without rebuild).
        - name: issue-fix-skill
          mountPath: /opt/ai-factory/skills/issue-fix/SKILL.md
          subPath: SKILL.md
          readOnly: true
        {{- end }}
        {{- end }}
      {{- if or .Values.codex.authSecretName .Values.codex.skillConfigMapName }}
      volumes:
      {{- if .Values.codex.authSecretName }}
      - name: codex-auth
        secret:
          secretName: {{ .Values.codex.authSecretName }}
      {{- end }}
      {{- if .Values.codex.skillConfigMapName }}
      - name: issue-fix-skill
        configMap:
          name: {{ .Values.codex.skillConfigMapName }}
      {{- end }}
      {{- end }}
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: go-dev
  namespace: {{ include "ai-factory.namespace" . }}
  labels:
    {{- include "ai-factory.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.sandbox.warmPoolReplicas }}
  sandboxTemplateRef:
    name: go-dev

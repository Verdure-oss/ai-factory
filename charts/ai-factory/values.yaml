# ai-factory Helm Chart Values

# Server configuration
server:
  # Server image
  image:
    repository: ai-factory-server
    tag: latest
    pullPolicy: IfNotPresent

  # Server replica count
  replicaCount: 1

  # Max tasks executed concurrently. Tasks beyond this are queued (ai-factory-waiting).
  # Keep <= sandbox.warmPoolReplicas so requests can always adopt a warm pool pod.
  maxConcurrentTasks: 2

  # CI feedback loop: after a PR is created, wait for GitHub check events and
  # repair CI failures in the reused sandbox. No polling — GitHub webhooks
  # (check_suite / check_run completed) drive the verdict via /webhook/github.
  # ciWatchSettleInterval is the short confirm window T that converges
  # late-registering check suites once every suite has completed; it never
  # waits for CI to run.
  ciWatchEnabled: true
  ciWatchMaxRetries: 3
  ciWatchMaxWait: 30m
  ciWatchSettleInterval: 60s
  ciWatchMaxToolRounds: 3
  ciWatchLogSnippetLines: 20

  # Service configuration
  service:
    type: NodePort
    port: 80
    nodePort: 32519

  # Ingress configuration
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
      - host: ai-factory.example.com
        paths:
          - path: /webhook
            pathType: Prefix
          - path: /healthz
            pathType: Exact
    tls: []
    #  - secretName: ai-factory-tls
    #    hosts:
    #      - ai-factory.example.com

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Liveness probe
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

  # Readiness probe
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

# Sandbox configuration
sandbox:
  # Sandbox image (coding agent)
  image:
    repository: coding-agent-sandbox
    tag: latest
    pullPolicy: IfNotPresent

  # Warm pool replicas
  warmPoolReplicas: 2

  # Container name in sandbox
  containerName: dev

# Codex delegated mode (optional). When the agent command runs Codex, the agent
# owns the full workflow (edit/local-CI/commit/push/PR) driven by an editable
# skill. Codex is pre-installed in the sandbox image; these wire in its auth and
# the marketplace plugin carrying the workflow skill. Empty by default (delegated
# mode off).
codex:
  # Name of a Secret holding Codex auth (`codex login` output). It must have a
  # key `auth.json`; it is mounted read-only at /home/agent/.codex/auth.json.
  # Create it with, e.g.:
  #   kubectl -n <ns> create secret generic codex-auth \
  #     --from-file=auth.json=$HOME/.codex/auth.json
  authSecretName: ""


  # Optional model override for Codex delegated mode, passed as `codex exec
  # --model`. Empty = use the default from auth.json / ~/.codex/config.toml
  # (for a ChatGPT-account login this is Codex's built-in GPT-5-codex default;
  # for a custom provider it is whatever config.toml sets).
  model: ""

  # Codex marketplace plugin carrying the delegated workflow skills. When
  # `source` is set, the agent registers this marketplace and reinstalls the
  # plugin at the start of every task, so pushing a skill edit takes effect on
  # the next task with no image or pod rebuild. Empty = plugin mode off (the
  # agent runs with task instructions only, or the skill path set via env).
  plugin:
    # owner/repo, an https git URL, or a local path inside the sandbox.
    source: ""
    # Plugin name as declared in the marketplace catalog.
    name: "issue-fix"
    # Marketplace name (the `name` field in .agents/plugins/marketplace.json).
    marketplace: "ai-factory"
    # Git ref to track.
    ref: "main"

# Agent configuration
agent:
  # Agent name
  name: builder

  # Agent command for run mode
  command: "ai-factory-agent openai-compatible"

  # Agent command for smoke mode (no-op: writes prompt to file without calling LLM)
  smokeCommand: "cat >/tmp/ai-factory-agent-prompt.txt"

  # Smoke commands (run in sandbox to verify environment and create marker file)
  # Mirrors FACTORY_SMOKE_COMMAND from .github/workflows/issue-factorytask.yaml
  smokeCommands:
    - "mkdir -p .ai-factory/smoke && echo smoke-$(date +%s) > .ai-factory/smoke/placeholder.txt && test -s /tmp/ai-factory-agent-prompt.txt && git --version && go version && node --version && python3 --version && command -v ai-factory-agent && command -v codex && command -v gh && command -v glab"

  # Validation commands for run mode
  # 留空则跳过验证，直接创建 PR
  validationCommands: []

# Webhook configuration
webhook:
  # Webhook secret (set via --set or in secret)
  secret: ""

# GitHub configuration
github:
  # GitHub token (set via --set or in secret)
  token: ""
  # Fork PR workflow: owner of the fork used to create PRs against an upstream
  # public repository. When set, ai-factory clones the fork and opens the PR
  # from fork:branch -> upstream:base. If empty, the authenticated token owner
  # is auto-detected. Disable by setting to "" (or omit) to keep direct flow.
  # Only relevant for the GitHub provider.
  forkOwner: ""
  # Optional allow-list of repositories (owner/repo) allowed to trigger
  # FactoryTasks via webhook. Empty = no restriction (all repos allowed).
  # Can be repeated; matches against the event's owner/repo.
  repositoryAllowList: []

# GitLab configuration
gitlab:
  # GitLab token (set via --set or in secret). Required when gitProvider=gitlab.
  token: ""
  # GitLab API base override (optional). Empty = derive https://<host>/api/v4
  # from the issue/project host (self-hosted instances).
  apiBase: ""

# OpenAI configuration
openai:
  # OpenAI API key (set via --set or in secret)
  apiKey: ""
  # Codex API key (optional, for Codex CLI)
  codexApiKey: ""
  # OpenAI-compatible base URL
  baseUrl: "https://api.openai.com/v1"
  # Model name
  model: "gpt-4.1"
  # Temperature (0~2). Higher = more creative/divergent; too high makes the
  # agent deviate from "return only a POSIX script" and triggers retries.
  # Deterministic/strict tasks: 0.2-0.4; creative tasks: 0.7-1.
  temperature: "1"
  # Max output tokens PER single model response (not the context window).
  # Must not exceed the model's real completion limit; too small -> truncation
  # (finish_reason=length) counts as invalid and wastes final-script rounds.
  maxTokens: "48000"
  # Max model calls in the tool-exploration phase (most expensive stage:
  # each round = 1 model call + Shell tool execution). Small fixes: 10-20.
  maxToolRounds: "40"
  # Max retries in the final-script phase (each retry = previous output invalid).
  maxFinalScriptRounds: "5"
  # Max repair attempts after the generated script fails. Key fallback for
  # complex tasks; raise to 5-6 if failures are frequent.
  maxRepairRounds: "3"
  # Total timeout in seconds
  totalTimeoutSeconds: "1800"
  # Exploration request timeout in seconds
  explorationRequestTimeoutSeconds: "180"
  # Final request timeout in seconds
  finalRequestTimeoutSeconds: "90"
  # Repair request timeout in seconds
  repairRequestTimeoutSeconds: "90"
  # Enable issue image input (multimodal). true = extract image URLs from the
  # issue and send them as image_url content blocks so the model can read
  # screenshots; false = keep the original text-only prompt.
  visionEnabled: "true"

# Namespace
namespace: ai-factory

# Git proxy URL (optional, e.g. http://proxy:port)
# When set, the controller configures git to use this proxy for HTTPS operations.
gitProxy: ""

# Watch interval for controller
watchInterval: 15s

# Task timeout
taskTimeout: 30m

# Enable change request (PR creation)
changeRequestEnabled: true

# Enable reporting (issue comments)
reportEnabled: true

# Git provider this instance serves: "github" or "gitlab".
# REQUIRED — the server refuses to start without GIT_PROVIDER, and the chart
# fails at install/upgrade time if this is unset or not one of the two values.
# One instance serves one provider: deploy GitHub on a public host and GitLab
# on the internal network, separately.
gitProvider: ""

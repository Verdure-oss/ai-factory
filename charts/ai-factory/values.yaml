# ai-factory Helm Chart Values

# Server configuration
server:
  # Server image
  image:
    repository: ai-factory-server
    tag: latest
    pullPolicy: IfNotPresent

  # Server replica count
  replicaCount: 1

  # Service configuration
  service:
    type: NodePort
    port: 80
    nodePort: 32519

  # Ingress configuration
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
      - host: ai-factory.example.com
        paths:
          - path: /webhook
            pathType: Prefix
          - path: /healthz
            pathType: Exact
    tls: []
    #  - secretName: ai-factory-tls
    #    hosts:
    #      - ai-factory.example.com

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Liveness probe
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

  # Readiness probe
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

# Sandbox configuration
sandbox:
  # Sandbox image (coding agent)
  image:
    repository: coding-agent-sandbox
    tag: latest
    pullPolicy: IfNotPresent

  # Warm pool replicas
  warmPoolReplicas: 2

  # Container name in sandbox
  containerName: dev

# Agent configuration
agent:
  # Agent name
  name: builder

  # Agent command for run mode
  command: "ai-factory-agent openai-compatible"

  # Agent command for smoke mode (no-op: writes prompt to file without calling LLM)
  smokeCommand: "cat >/tmp/ai-factory-agent-prompt.txt"

  # Smoke commands (run in sandbox to verify environment and create marker file)
  # Mirrors FACTORY_SMOKE_COMMAND from .github/workflows/issue-factorytask.yaml
  smokeCommands:
    - "mkdir -p .ai-factory/smoke && echo smoke-$(date +%s) > .ai-factory/smoke/placeholder.txt && test -s /tmp/ai-factory-agent-prompt.txt && git --version && go version && node --version && python3 --version && command -v ai-factory-agent"

  # Validation commands for run mode
  # 留空则跳过验证，直接创建 PR
  validationCommands: []

# Webhook configuration
webhook:
  # Webhook secret (set via --set or in secret)
  secret: ""

# GitHub configuration
github:
  # GitHub token (set via --set or in secret)
  token: ""
  # Fork PR workflow: owner of the fork used to create PRs against an upstream
  # public repository. When set, ai-factory clones the fork and opens the PR
  # from fork:branch -> upstream:base. If empty, the authenticated token owner
  # is auto-detected. Disable by setting to "" (or omit) to keep direct flow.
  # Only relevant for the GitHub provider.
  forkOwner: ""
  # Optional allow-list of repositories (owner/repo) allowed to trigger
  # FactoryTasks via webhook. Empty = no restriction (all repos allowed).
  # Can be repeated; matches against the event's owner/repo.
  repositoryAllowList: []

# GitLab configuration
gitlab:
  # GitLab token (set via --set or in secret)
  token: ""

# OpenAI configuration
openai:
  # OpenAI API key (set via --set or in secret)
  apiKey: ""
  # Codex API key (optional, for Codex CLI)
  codexApiKey: ""
  # OpenAI-compatible base URL
  baseUrl: "https://api.openai.com/v1"
  # Model name
  model: "gpt-4.1"
  # Temperature (0~2). Higher = more creative/divergent; too high makes the
  # agent deviate from "return only a POSIX script" and triggers retries.
  # Deterministic/strict tasks: 0.2-0.4; creative tasks: 0.7-1.
  temperature: "1"
  # Max output tokens PER single model response (not the context window).
  # Must not exceed the model's real completion limit; too small -> truncation
  # (finish_reason=length) counts as invalid and wastes final-script rounds.
  maxTokens: "48000"
  # Max model calls in the tool-exploration phase (most expensive stage:
  # each round = 1 model call + Shell tool execution). Small fixes: 10-20.
  maxToolRounds: "40"
  # Max retries in the final-script phase (each retry = previous output invalid).
  maxFinalScriptRounds: "5"
  # Max repair attempts after the generated script fails. Key fallback for
  # complex tasks; raise to 5-6 if failures are frequent.
  maxRepairRounds: "3"
  # Total timeout in seconds
  totalTimeoutSeconds: "1800"
  # Exploration request timeout in seconds
  explorationRequestTimeoutSeconds: "180"
  # Final request timeout in seconds
  finalRequestTimeoutSeconds: "90"
  # Repair request timeout in seconds
  repairRequestTimeoutSeconds: "90"

# Namespace
namespace: ai-factory

# Git proxy URL (optional, e.g. http://proxy:port)
# When set, the controller configures git to use this proxy for HTTPS operations.
gitProxy: ""

# Watch interval for controller
watchInterval: 15s

# Task timeout
taskTimeout: 30m

# Enable change request (PR creation)
changeRequestEnabled: true

# Enable reporting (issue comments)
reportEnabled: true

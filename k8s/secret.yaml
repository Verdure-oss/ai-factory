apiVersion: v1
kind: Secret
metadata:
  name: ai-factory-credentials
  namespace: ai-factory
type: Opaque
stringData:
  # GitHub Personal Access Token with permissions:
  #   - issues: write (comment on issues, change labels)
  #   - contents: write (push branches)
  #   - pull-requests: write (create PRs)
  #   - metadata: read (read repo info)
  GITHUB_TOKEN: "ghp_xxxxxxxxxxxx"

  # Webhook secret for GitHub signature verification
  # Must match the secret configured in GitHub webhook settings
  WEBHOOK_SECRET: "your-webhook-secret"

  # OpenAI API key for the coding agent
  OPENAI_API_KEY: "sk-xxxxxxxxxxxx"

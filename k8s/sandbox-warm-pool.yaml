# SandboxTemplate and SandboxWarmPool for ai-factory
# This creates a warm pool of coding agent sandboxes for fast task execution

apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: go-dev
  namespace: ai-factory
spec:
  envVarsInjectionPolicy: Allowed
  networkPolicyManagement: Unmanaged
  podTemplate:
    spec:
      containers:
      - name: dev
        image: ai-factory/coding-agent-sandbox:ci
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -lc
        - mkdir -p /workspace && sleep 3600
        workingDir: /workspace
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: go-dev
  namespace: ai-factory
spec:
  replicas: 2  # Keep 2 sandboxes warm for concurrent tasks
  sandboxTemplateRef:
    name: go-dev

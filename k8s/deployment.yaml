apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-factory-server
  namespace: ai-factory
  labels:
    app: ai-factory-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-factory-server
  template:
    metadata:
      labels:
        app: ai-factory-server
    spec:
      serviceAccountName: ai-factory-server
      containers:
      - name: server
        image: ai-factory-server:latest
        args:
        - server
        - --addr=:8080
        - --namespace=ai-factory
        - --agent=builder
        - --sandbox-template=go-dev
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: ai-factory-credentials
              key: WEBHOOK_SECRET
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: ai-factory-credentials
              key: GITHUB_TOKEN
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-factory-credentials
              key: OPENAI_API_KEY
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-factory-server
  namespace: ai-factory
  labels:
    app: ai-factory-server
  annotations:
    # For nginx ingress controller
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # For cert-manager (optional)
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ai-factory.example.com  # Replace with your domain
    secretName: ai-factory-tls  # Replace with your TLS secret
  rules:
  - host: ai-factory.example.com  # Replace with your domain
    http:
      paths:
      - path: /webhook
        pathType: Prefix
        backend:
          service:
            name: ai-factory-server
            port:
              number: 80
      - path: /healthz
        pathType: Exact
        backend:
          service:
            name: ai-factory-server
            port:
              number: 80
